<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小番茄图片混淆批量处理工具</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --primary-color: #3b82f6;
            --primary-hover: #2563eb;
            --secondary-color: #10b981;
            --secondary-hover: #059669;
            --bg-primary: #ffffff;
            --bg-secondary: #f8fafc;
            --bg-tertiary: #f1f5f9;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --border-color: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --radius-md: 0.5rem;
            --radius-lg: 0.75rem;
            --radius-xl: 1rem;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            line-height: 1.6;
        }

        .app-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background-color: var(--bg-primary);
            border-bottom: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1.5rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .main-content {
            flex: 1;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        .welcome-card {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-hover));
            color: white;
            border-radius: var(--radius-xl);
            padding: 2.5rem;
            margin-bottom: 2rem;
            box-shadow: var(--shadow-md);
            text-align: center;
        }

        .welcome-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .card {
            background: var(--bg-primary);
            border-radius: var(--radius-lg);
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .upload-area {
            border: 2px dashed var(--border-color);
            border-radius: var(--radius-lg);
            padding: 3rem 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background-color: var(--bg-secondary);
            display: block;
            outline: none;
        }

        .upload-area:hover {
            border-color: var(--primary-color);
            background-color: #eff6ff;
        }

        .upload-icon {
            font-size: 4rem;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
            transition: color 0.3s ease;
        }

        .upload-area:hover .upload-icon {
            color: var(--primary-color);
        }

        .upload-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0.75rem 2rem;
            border-radius: var(--radius-md);
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .upload-btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        #fileInput {
            display: none;
        }

        #selectedFiles {
            margin-top: 1.5rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 500;
            text-align: left;
            padding: 1rem;
            background-color: var(--bg-tertiary);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
        }

        .controls {
            margin-top: 2rem;
        }

        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1rem;
        }

        .control-button {
            padding: 0.875rem 1.5rem;
            border: none;
            border-radius: var(--radius-md);
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .encrypt-button {
            background-color: var(--primary-color);
            color: white;
        }

        .encrypt-button:hover:not(:disabled) {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
        }

        .decrypt-button {
            background-color: var(--secondary-color);
            color: white;
        }

        .decrypt-button:hover:not(:disabled) {
            background-color: var(--secondary-hover);
            transform: translateY(-2px);
        }

        .download-button {
            background-color: #8b5cf6;
            color: white;
        }

        .download-button:hover:not(:disabled) {
            background-color: #7c3aed;
            transform: translateY(-2px);
        }

        .control-button:disabled {
            background-color: var(--text-muted);
            cursor: not-allowed;
            transform: none;
        }

        .progress-section {
            margin-top: 2rem;
            background-color: var(--bg-tertiary);
            padding: 1.5rem;
            border-radius: var(--radius-lg);
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .progress-bar {
            height: 0.75rem;
            background-color: var(--border-color);
            border-radius: 9999px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-color), var(--primary-hover));
            border-radius: 9999px;
            transition: width 0.3s ease;
        }

        .thread-info {
            margin-top: 1rem;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .images-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .image-card {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
        }

        .image-preview-container {
            height: 220px;
            background-color: var(--bg-tertiary);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .image-preview {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .image-info {
            padding: 1.25rem;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .image-name {
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .image-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: auto;
        }

        .image-action-btn {
            flex: 1;
            padding: 0.5rem 0.75rem;
            border: 1px solid var(--border-color);
            background-color: var(--bg-tertiary);
            color: var(--text-secondary);
            border-radius: var(--radius-md);
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.25rem;
        }

        .image-action-btn:hover {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .image-status {
            margin-top: 0.75rem;
            padding: 0.5rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 500;
            text-align: center;
        }

        .status-waiting {
            background-color: var(--bg-tertiary);
            color: var(--text-secondary);
        }

        .status-processing {
            background-color: #dbeafe;
            color: #1e40af;
        }

        .status-success {
            background-color: #dcfce7;
            color: #166534;
        }

        .status-error {
            background-color: #fee2e2;
            color: #991b1b;
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-muted);
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 1.5rem;
        }

        .footer {
            background-color: var(--bg-primary);
            border-top: 1px solid var(--border-color);
            padding: 1.5rem;
            text-align: center;
        }

        .footer-content {
            max-width: 1200px;
            margin: 0 auto;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                gap: 1rem;
                text-align: center;
            }

            .main-content {
                padding: 1.5rem 1rem;
            }

            .card {
                padding: 1.5rem;
            }

            .buttons-grid {
                grid-template-columns: 1fr;
            }

            .images-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="header">
            <div class="header-content">
                <div class="header-title">
                    <i class="fas fa-image"></i>
                    小番茄图片混淆批量处理工具
                </div>
            </div>
        </header>

        <main class="main-content">
            <section class="welcome-card">
                <h1 class="welcome-title">高效批量处理您的图片</h1>
                <p>基于希尔伯特曲线算法的图片混淆工具，支持批量混淆、解混淆</p>
            </section>

            <section class="card">
                <label class="upload-area" for="fileInput">
                    <div class="upload-icon">
                        <i class="fas fa-cloud-upload-alt"></i>
                    </div>
                    <div class="upload-text">
                        <h3>拖放图片到此处或点击选择文件</h3>
                        <p>支持JPG、PNG、BMP、WEBP等常见图片格式，可批量上传</p>
                        <br>
                        <button class="upload-btn">
                            <i class="fas fa-plus"></i> 选择图片文件
                        </button>
                    </div>
                </label>
                <input type="file" id="fileInput" accept="image/*" multiple>
                <div id="selectedFiles">未选择任何文件</div>

                <div class="controls">
                    <div class="buttons-grid">
                        <button id="encryptBtn" class="control-button encrypt-button" disabled>
                            <i class="fas fa-lock"></i> 批量混淆图片
                        </button>
                        <button id="decryptBtn" class="control-button decrypt-button" disabled>
                            <i class="fas fa-unlock"></i> 批量解混淆图片
                        </button>
                        <button id="downloadBtn" class="control-button download-button" disabled>
                            <i class="fas fa-download"></i> 下载所有图片
                        </button>
                    </div>
                </div>

                <div class="progress-section">
                    <div class="progress-header">
                        <div class="progress-label">处理进度</div>
                        <div class="progress-counter" id="progressText">0 / 0 已完成</div>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <div class="thread-info" id="threadInfo">
                        <i class="fas fa-microchip"></i> 多线程处理已启用
                    </div>
                </div>
            </section>

            <section class="card">
                <h2 class="card-title">
                    <i class="fas fa-images"></i>
                    图片预览
                </h2>
                <div class="images-grid" id="imageGrid">
                    <div id="emptyState" class="empty-state">
                        <div class="empty-state-icon">
                            <i class="fas fa-picture-o"></i>
                        </div>
                        <div class="empty-state-text">
                            <h3>暂无图片</h3>
                            <p>请上传图片以开始处理</p>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <footer class="footer">
            <div class="footer-content">
                <p>© 2023 小番茄图片混淆批量处理工具 | 基于希尔伯特曲线算法</p>
            </div>
        </footer>
    </div>

    <script>
        // 希尔伯特曲线生成函数
        function gilbert2d(width, height) {
            const coordinates = [];
            if (width >= height) {
                generate2d(0, 0, width, 0, 0, height, coordinates);
            } else {
                generate2d(0, 0, 0, height, width, 0, coordinates);
            }
            return coordinates;
        }

        function generate2d(x, y, ax, ay, bx, by, coordinates) {
            const w = Math.abs(ax + ay);
            const h = Math.abs(bx + by);
            const dax = Math.sign(ax), day = Math.sign(ay);
            const dbx = Math.sign(bx), dby = Math.sign(by);

            if (h === 1) {
                for (let i = 0; i < w; i++) {
                    coordinates.push([x, y]);
                    x += dax;
                    y += day;
                }
                return;
            }

            if (w === 1) {
                for (let i = 0; i < h; i++) {
                    coordinates.push([x, y]);
                    x += dbx;
                    y += dby;
                }
                return;
            }

            let ax2 = Math.floor(ax / 2), ay2 = Math.floor(ay / 2);
            let bx2 = Math.floor(bx / 2), by2 = Math.floor(by / 2);
            const w2 = Math.abs(ax2 + ay2);
            const h2 = Math.abs(bx2 + by2);

            if (2 * w > 3 * h) {
                if ((w2 % 2) && (w > 2)) {
                    ax2 += dax;
                    ay2 += day;
                }
                generate2d(x, y, ax2, ay2, bx, by, coordinates);
                generate2d(x + ax2, y + ay2, ax - ax2, ay - ay2, bx, by, coordinates);
            } else {
                if ((h2 % 2) && (h > 2)) {
                    bx2 += dbx;
                    by2 += dby;
                }
                generate2d(x, y, bx2, by2, ax2, ay2, coordinates);
                generate2d(x + bx2, y + by2, ax, ay, bx - bx2, by - by2, coordinates);
                generate2d(x + (ax - dax) + (bx2 - dbx), y + (ay - day) + (by2 - dby),
                    -bx2, -by2, -(ax - ax2), -(ay - ay2), coordinates);
            }
        }

        // 加密函数
        function encrypt(img) {
            return new Promise((resolve) => {
                const cvs = document.createElement("canvas");
                const width = cvs.width = img.width;
                const height = cvs.height = img.height;
                const ctx = cvs.getContext("2d");
                ctx.drawImage(img, 0, 0);
                const imgdata = ctx.getImageData(0, 0, width, height);
                const imgdata2 = new ImageData(width, height);
                const curve = gilbert2d(width, height);
                const offset = Math.round((Math.sqrt(5) - 1) / 2 * width * height);
                
                for(let i = 0; i < width * height; i++){
                    const old_pos = curve[i];
                    const new_pos = curve[(i + offset) % (width * height)];
                    const old_p = 4 * (old_pos[0] + old_pos[1] * width);
                    const new_p = 4 * (new_pos[0] + new_pos[1] * width);
                    imgdata2.data.set(imgdata.data.slice(old_p, old_p + 4), new_p);
                }
                
                ctx.putImageData(imgdata2, 0, 0);
                cvs.toBlob(b => {
                    resolve(URL.createObjectURL(b));
                }, "image/jpeg", 0.95);
            });
        }

        // 解密函数
        function decrypt(img) {
            return new Promise((resolve) => {
                const cvs = document.createElement("canvas");
                const width = cvs.width = img.width;
                const height = cvs.height = img.height;
                const ctx = cvs.getContext("2d");
                ctx.drawImage(img, 0, 0);
                const imgdata = ctx.getImageData(0, 0, width, height);
                const imgdata2 = new ImageData(width, height);
                const curve = gilbert2d(width, height);
                const offset = Math.round((Math.sqrt(5) - 1) / 2 * width * height);
                
                for(let i = 0; i < width * height; i++){
                    const old_pos = curve[i];
                    const new_pos = curve[(i + offset) % (width * height)];
                    const old_p = 4 * (old_pos[0] + old_pos[1] * width);
                    const new_p = 4 * (new_pos[0] + new_pos[1] * width);
                    imgdata2.data.set(imgdata.data.slice(new_p, new_p + 4), old_p);
                }
                
                ctx.putImageData(imgdata2, 0, 0);
                cvs.toBlob(b => {
                    resolve(URL.createObjectURL(b));
                }, "image/jpeg", 0.95);
            });
        }

        // DOM元素
        const fileInput = document.getElementById('fileInput');
        const encryptBtn = document.getElementById('encryptBtn');
        const decryptBtn = document.getElementById('decryptBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const selectedFiles = document.getElementById('selectedFiles');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const imageGrid = document.getElementById('imageGrid');
        const emptyState = document.getElementById('emptyState');
        const threadInfo = document.getElementById('threadInfo');
        
        let uploadedImages = [];
        let processedImages = [];
        let isProcessing = false;
        const MAX_THREADS = navigator.hardwareConcurrency || 4;
        
        threadInfo.innerHTML = `<i class="fas fa-microchip"></i> 多线程处理已启用 (${MAX_THREADS}个线程)`;
        
        // 文件选择
        fileInput.addEventListener('change', function(e) {
            if (isProcessing) {
                alert('请等待当前处理完成后再上传新图片');
                return;
            }
            
            if (e.target.files.length > 0) {
                selectedFiles.textContent = `已选择 ${e.target.files.length} 个文件`;
                encryptBtn.disabled = false;
                decryptBtn.disabled = false;
                
                emptyState.style.display = 'none';
                uploadedImages = [];
                processedImages = [];
                
                Array.from(imageGrid.children).forEach(child => {
                    if (child.id !== 'emptyState') {
                        child.remove();
                    }
                });
                
                Array.from(e.target.files).forEach((file, index) => {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const img = new Image();
                        img.onload = function() {
                            uploadedImages.push({
                                index: index,
                                name: file.name,
                                originalUrl: URL.createObjectURL(file),
                                image: img,
                                width: img.width,
                                height: img.height
                            });
                            
                            const imageItem = document.createElement('div');
                            imageItem.className = 'image-card';
                            imageItem.innerHTML = `
                                <div class="image-preview-container">
                                    <img class="image-preview" src="${URL.createObjectURL(file)}" alt="${file.name}">
                                </div>
                                <div class="image-info">
                                    <div class="image-name">${file.name}</div>
                                    <div class="image-actions">
                                        <button class="image-action-btn" onclick="downloadSingleImage(${index})">
                                            <i class="fas fa-download"></i>
                                            下载
                                        </button>
                                    </div>
                                    <div class="image-status status-waiting" data-index="${index}">等待处理</div>
                                </div>
                            `;
                            imageGrid.appendChild(imageItem);
                        };
                        img.src = e.target.result;
                    };
                    reader.readAsDataURL(file);
                });
            }
        });
        
        // 多线程批量处理
        async function batchProcess(mode) {
            if (uploadedImages.length === 0 || isProcessing) return;
            
            isProcessing = true;
            encryptBtn.disabled = true;
            decryptBtn.disabled = true;
            downloadBtn.disabled = true;
            
            processedImages = [];
            const total = uploadedImages.length;
            let completed = 0;
            
            progressFill.style.width = '0%';
            progressText.textContent = `0 / ${total} 已完成`;
            
            // 使用线程池处理图片
            const processQueue = [...uploadedImages];
            const activeWorkers = new Set();
            
            while (processQueue.length > 0 || activeWorkers.size > 0) {
                while (activeWorkers.size < MAX_THREADS && processQueue.length > 0) {
                    const imageData = processQueue.shift();
                    const workerPromise = processSingleImage(imageData, mode, completed + activeWorkers.size, total);
                    activeWorkers.add(workerPromise);
                    
                    workerPromise.then(result => {
                        activeWorkers.delete(workerPromise);
                        completed++;
                        
                        const progress = Math.round((completed / total) * 100);
                        progressFill.style.width = `${progress}%`;
                        progressText.textContent = `${completed} / ${total} 已完成`;
                    });
                }
                
                if (activeWorkers.size > 0) {
                    await Promise.race(activeWorkers);
                }
            }
            
            isProcessing = false;
            downloadBtn.disabled = false;
        }
        
        // 处理单张图片
        async function processSingleImage(imageData, mode, index, total) {
            const statusElement = document.querySelector(`.image-status[data-index="${imageData.index}"]`);
            
            try {
                statusElement.textContent = '处理中...';
                statusElement.className = 'image-status status-processing';
                
                const processFunc = mode === 'encrypt' ? encrypt : decrypt;
                const statusText = mode === 'encrypt' ? '已混淆' : '已解混淆';
                
                const processedUrl = await processFunc(imageData.image);
                
                processedImages.push({
                    index: imageData.index,
                    name: imageData.name,
                    originalUrl: imageData.originalUrl,
                    processedUrl: processedUrl,
                    mode: mode
                });
                
                if (statusElement && statusElement.closest('.image-card')) {
                    const imageCard = statusElement.closest('.image-card');
                    const imgPreview = imageCard.querySelector('.image-preview');
                    imgPreview.src = processedUrl;
                }
                
                statusElement.textContent = statusText;
                statusElement.className = 'image-status status-success';
                
            } catch (error) {
                statusElement.textContent = '处理失败';
                statusElement.className = 'image-status status-error';
                console.error(`处理图片 ${imageData.name} 时出错:`, error);
            }
        }
        
        encryptBtn.addEventListener('click', () => batchProcess('encrypt'));
        decryptBtn.addEventListener('click', () => batchProcess('decrypt'));
        
        downloadBtn.addEventListener('click', async function() {
            if (processedImages.length === 0) return;
            
            const imagesToDownload = processedImages.length > 0 ? processedImages : uploadedImages;
            
            if (imagesToDownload.length > 100) {
                // 超过100张，压缩成zip
                await downloadAsZip(imagesToDownload);
            } else {
                // 不超过100张，逐个下载
                for (let i = 0; i < imagesToDownload.length; i++) {
                    await downloadSingleImage(imagesToDownload[i].index);
                    await new Promise(resolve => setTimeout(resolve, 100));
                }
            }
        });
        
        // 下载为zip压缩包
        async function downloadAsZip(images) {
            const zip = new JSZip();
            const folder = zip.folder("图片处理结果");
            
            // 显示进度
            let completed = 0;
            const total = images.length;
            progressFill.style.width = '0%';
            progressText.textContent = `压缩中: 0 / ${total}`;
            
            for (const image of images) {
                try {
                    const url = image.processedUrl || image.originalUrl;
                    const response = await fetch(url);
                    const blob = await response.blob();
                    
                    let fileName = image.name;
                    const dotIndex = fileName.lastIndexOf('.');
                    const name = dotIndex !== -1 ? fileName.substring(0, dotIndex) : fileName;
                    const ext = dotIndex !== -1 ? fileName.substring(dotIndex) : '.jpg';
                    
                    if (image.processedUrl) {
                        const prefix = image.mode === 'encrypt' ? '混淆_' : '解混淆_';
                        fileName = prefix + name + ext;
                    }
                    
                    folder.file(fileName, blob);
                    
                    completed++;
                    const progress = Math.round((completed / total) * 100);
                    progressFill.style.width = `${progress}%`;
                    progressText.textContent = `压缩中: ${completed} / ${total}`;
                    
                } catch (error) {
                    console.error(`压缩图片 ${image.name} 时出错:`, error);
                }
            }
            
            // 生成zip文件
            const zipBlob = await zip.generateAsync({ type: 'blob' });
            const url = URL.createObjectURL(zipBlob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = '图片处理结果.zip';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            progressText.textContent = `压缩完成: ${total} / ${total}`;
        }
        
        window.downloadSingleImage = async function(index) {
            const imageData = processedImages.find(img => img.index === index) || uploadedImages.find(img => img.index === index);
            if (!imageData) return;
            
            const url = imageData.processedUrl || imageData.originalUrl;
            const a = document.createElement('a');
            a.href = url;
            
            let fileName = imageData.name;
            const dotIndex = fileName.lastIndexOf('.');
            const name = dotIndex !== -1 ? fileName.substring(0, dotIndex) : fileName;
            const ext = dotIndex !== -1 ? fileName.substring(dotIndex) : '.jpg';
            
            if (imageData.processedUrl) {
                const prefix = imageData.mode === 'encrypt' ? '混淆_' : '解混淆_';
                fileName = prefix + name + ext;
            }
            
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        };
    </script>
</body>
